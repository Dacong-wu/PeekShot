[PeekShot]
; 摄像头名称。留空 = 使用第一个找到的摄像头
; （可用日志文件中记录的设备列表查看可用名称）
CameraName=Integrated Camera
; 退出热键。格式: 修饰键+...+按键，例如 Ctrl+Alt+Q
; 修饰键: Ctrl / Alt / Shift / Win
; 按键: A-Z, 0-9, F1-F24, Space, Enter, Esc, Tab, Backspace,
;       Delete, Insert, Home, End, PageUp, PageDown, Pause
;       或 0x20-0xFE 的原始虚拟键码（如 0x51 = Q）
; 留空 = 禁用退出热键
; 修改后需重新启动程序生效
Hotkey=Ctrl+Alt+Q
; 摄像头等待上限（秒，1-60）
CaptureTimeoutSeconds=5
; 丢弃的前几帧数（0-9；自动曝光未稳定时画面可能偏暗）
SkipFrames=1
